<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex,nofollow">
<title>The Ultimate twenty one pilots Bracket</title>
<style>
:root{--bg:#0b0b0c;--card:#16161a;--ink:#f3f1ea;--mut:#9a978d;--y:#fce300;--r:#e4322b;--line:#2a2a30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;background:
 radial-gradient(1200px 500px at 50% -200px,rgba(252,227,0,.10),transparent 70%),
 repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 2px,transparent 2px 8px),var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.brand{font-weight:900;letter-spacing:.18em;font-size:11px;text-transform:uppercase;color:var(--mut)}
.brand b{color:var(--y)}
.tape{height:6px;background:repeating-linear-gradient(90deg,var(--y) 0 14px,#111 14px 22px);opacity:.9;border-radius:2px;margin:6px 0 14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ghost{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--mut)}
.ghost:disabled{opacity:.3}
h1{font-size:clamp(34px,10vw,52px);line-height:.95;margin:22px 0 10px;font-weight:900;letter-spacing:-.02em;text-transform:lowercase}
h1 .y{color:var(--y)} h1 .r{color:var(--r)}
.lead{color:var(--mut);font-size:16px;line-height:1.5;margin:0 0 22px}
.cta{display:block;width:100%;background:var(--y);color:#111;font-weight:900;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:18px;border-radius:14px;box-shadow:0 8px 30px rgba(252,227,0,.18)}
.cta:active{transform:scale(.98)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 22px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.fact b{display:block;font-size:24px;color:var(--y)} .fact span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.eras{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 26px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--c,#ccc);border:1px solid color-mix(in srgb,var(--c,#ccc) 45%,transparent)}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,#ccc)}
.round{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--y);font-weight:800}
.meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.meta small{color:var(--mut);font-size:13px}
.bar{height:6px;background:#1d1d22;border-radius:9px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--y),var(--r));transition:width .35s}
.match{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center}
.pick{position:relative;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px 20px;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:transform .12s,border-color .2s}
.pick:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.pick:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
.pick:active{transform:scale(.98)}
.pick.win{border-color:var(--y);box-shadow:0 0 0 2px var(--y) inset}
.pick .seed{position:absolute;top:14px;right:16px;font-size:12px;color:var(--mut);font-weight:700}
.pick .name{font-size:clamp(24px,7vw,32px);font-weight:900;line-height:1.05;margin-top:8px;position:relative;z-index:1}
.pick .chip{position:relative;z-index:1;align-self:flex-start}
.vs{text-align:center;font-weight:900;color:var(--r);letter-spacing:.3em;font-size:13px}
.hint{text-align:center;color:var(--mut);font-size:13px;margin-top:14px}
.lyric{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:20px 18px;font-size:19px;line-height:1.4;font-weight:600}
.lyric:active{transform:scale(.98)}
.lyric span{display:block}
.champ{text-align:center;padding:10px 0 0}
.crown{font-size:44px;margin:10px 0 0}
.champ .name{font-size:clamp(34px,10vw,50px);font-weight:900;line-height:1;margin:8px 0 10px}
.quote{position:relative;margin:30px 0 8px;padding:34px 20px 26px;border-radius:18px;background:#111;border:1px solid var(--line);font-size:22px;line-height:1.4;font-weight:700;text-align:center}
.quote:before{content:"\201C";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:64px;color:var(--y);font-family:Georgia,serif}
.quote span{display:block}
.path{margin:22px 0 0;border-top:1px solid var(--line)}
.path details{border-bottom:1px solid var(--line);padding:12px 2px}
.path summary{cursor:pointer;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.path ol{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.7;color:#cfccc2}
.path ol b{color:var(--ink)}
.small{color:var(--mut);font-size:12px;text-align:center;margin-top:22px}
.fade{animation:f .28s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const SONGS=[["Stressed Out", "Blurryface", ["Wish we could turn back time to the good old days", "Used to play pretend, give each other different names / We would build a rocket ship and then we'd fly it far away", "My name's Blurryface, and I care what you think"]], ["Heathens", "Single", ["All my friends are heathens, take it slow", "Wait for them to ask you who you know", "It looks like you might be one of us"]], ["Ride", "Blurryface", ["I'm fallin' so I'm takin' my time on my ride", "I'd live for you, and that's hard to do", "Who would you live for? / Who would you die for?"]], ["Car Radio", "Vessel", ["Sometimes quiet is violent", "Peace will win and fear will lose", "Faith is to be awake / And to be awake is for us to think"]], ["Chlorine", "Trench", ["Sippin' on straight chlorine / Let the vibe slide over me", "Rebel red carnation / Grows while I decay", "When I leave don't save my seat / I'll be back when it's all complete"]], ["Tear in My Heart", "Blurryface", ["My taste in music is your face", "She's the tear in my heart / I'm alive", "You fell asleep in my car, I drove the whole time"]], ["Holding On to You", "Vessel", ["You are surrounding all my surroundings", "It ain't the speakers that bump hearts / It's our hearts that make the beat", "And I'll be holding on to you"]], ["Heavydirtysoul", "Blurryface", ["Can you save my heavydirtysoul?", "This doesn't mean I lost my dream", "Death inspires me like a dog inspires a rabbit"]], ["Migraine", "Vessel", ["Am I the only one I know / Waging my wars behind my face and above my throat?", "And know that life / Has a hopeful undertone", "But I know we've made it this far, kid"]], ["Jumpsuit", "Trench", ["Jumpsuit, jumpsuit, cover me", "Spirits in my room, friend or foe? / Felt it in my youth, feel it when I'm old", "If you need anyone / I'll stop my plans"]], ["House of Gold", "Vessel", ["She asked me, son, when I grow old / Will you buy me a house of gold?", "I will make you / Queen of everything you see", "We'll make pretend that you and me / Lived ever after, happily"]], ["Trees", "Vessel", ["I know where you stand / Silent in the trees", "I want to know you / I want to see", "I can feel your breath / I can feel my death"]], ["The Judge", "Blurryface", ["You're the judge, oh, no / Set me free", "I'm a pro at imperfections / And I'm best friends with my doubt", "I know my soul's freezing / Hell's hot for good reason"]], ["Neon Gravestones", "Trench", ["Promise me this / If I lose to myself / You won't mourn a day", "Find your grandparents or someone of age / Pay some respects for the path that they paved", "Keep your wits about you while you got 'em"]], ["Level of Concern", "Single", ["Would you be / My little quarantine?", "Just need you to tell me we're alright / Tell me we're okay", "Panic on the brain, world has gone insane"]], ["Shy Away", "Scaled and Icy", ["Manifest a ceiling when you shy away / Searching for that feeling", "Just like an \"I love you\" / That isn't words", "Like a song he wrote / That's never heard"]], ["My Blood", "Trench", ["Stay with me / No, you don't need to run", "You're facing down a dark hall / I'll grab my light and go with you", "When everyone you thought you knew / Deserts your fight, I'll go with you"]], ["Goner", "Blurryface", ["I'm a goner, somebody catch my breath", "I wanna be known by you", "The ghost of you is close to me / I'm inside out, you're underneath"]], ["Leave the City", "Trench", ["In time I will leave the city / For now, I will stay alive", "But this year, though I'm far from home / In Trench, I'm not alone", "I'm tired of tending to this fire"]], ["Ode to Sleep", "Vessel", ["I'll stay awake / 'Cause the dark's not taking prisoners tonight", "Some see a pen, I see harpoon", "Why am I not scared in the morning?"]], ["Truce", "Vessel", ["Stay alive, stay alive for me", "Now the night is coming to an end / The sun will rise and we will try again", "Take pride in what is sure to die"]], ["Saturday", "Scaled and Icy", ["But on Saturday, Saturday, Saturday / We paint the town", "These are my dancing shoes / Thought I would dance with you", "Have you lost your footing, too? / I just pray that I'm not losing you"]], ["Next Semester", "Clancy", ["Can't change what you've done / Start fresh next semester", "I prayed those lights would take me home", "It's a taste test / Of what I hate less"]], ["Paladin Strait", "Clancy", ["I would swim the Paladin Strait / Without any flotation", "I can't be alone, guess I never told you so", "Just a glimpse of visual aid / Of you on the other shoreline"]], ["The Contract", "Breach", ["I check the doors, check the windows, and pull the blinds", "I used to see, it felt so real / But now I plead, just take the deal", "Promises and contracts I used to keep"]], ["Lovely", "Regional at Best", ["So try to love me and I'll try to save you", "Won't you stay alive? / I'll take you on a ride", "I will make you believe you are lovely"]], ["Kitchen Sink", "Regional at Best", ["Are you searching for purpose? / Then write something, yeah it might be worthless", "You'll see purpose start to surface", "Nobody thinks what I think / Nobody dreams when they blink"]], ["Redecorate", "Scaled and Icy", ["I don't want to go like this / At least let me clean my room", "Should they keep it on display / Or redecorate?", "She's not afraid of her reflection / But of what she might see behind it"]], ["City Walls", "Breach", ["I wanted you to show me / The way around those city walls", "I write a promise in pencil, but my loyalty's in pen", "But now the night has fallen / Abandoned by the sun"]], ["Fall Away", "twenty one pilots", ["I don't wanna fall, fall away / I'll keep the lights on in this place", "I disguise and I will lie, and I will take my precious time", "I can feel the pull begin / I feel my conscience wearing thin"]], ["Addict with a Pen", "twenty one pilots", ["Hello, we haven't talked in quite some time", "You hear me screaming \"Father!\" / And I'm lying here just crying", "So wash me with your water"]], ["Taxi Cab", "twenty one pilots", ["Sometimes we will die, and sometimes we will fly away / Either way, you're by my side until my dying days", "We're driving toward the morning sun / Where all your blood is washed away", "I said, \"Don't be afraid\" / We're going home"]]];
const ENDPOINT="https://formsubmit.co/ajax/3710517220abe049f68eda3202a7ccf6";
const ERA={"twenty one pilots":["Self-Titled","#3fb6a8"],"Regional at Best":["Regional at Best","#f2994a"],"Vessel":["Vessel","#9fc3e6"],"Blurryface":["Blurryface","#e4322b"],"Single":["Single","#b0b0b0"],"Trench":["Trench","#fce300"],"Scaled and Icy":["Scaled and Icy","#ff7ab6"],"Clancy":["Clancy","#ff5a36"],"Breach":["Breach","#c7d36f"]};
const ROUNDS=["Round of 32","Sweet 16","Elite 8","Final Four","Championship"];
// standard 32-seed bracket order: 1v32, 16v17, 8v25 ...
function order(n){let o=[1];while(o.length<n){const m=o.length*2+1;o=o.flatMap(s=>[s,m-s]);}return o;}
const SEEDED=order(32).map(s=>s-1); // indexes into SONGS (SONGS is in seed order)
const params=new URLSearchParams(location.search);
const TEST=params.get("t")==="1";
const KEY="topbracket.v1"+(TEST?".t":"");
let S=load()||fresh();
function fresh(){return{picks:[],lyric:null,sent:false,started:false,ts:Date.now()}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// derive bracket state from picks (list of winner song indexes, in match order)
function state(){
  let field=SEEDED.slice(),r=0,m=0,rounds=[],k=0;
  while(field.length>1){
    const next=[],res=[];
    for(let i=0;i<field.length;i+=2){
      const a=field[i],b=field[i+1];
      if(k<S.picks.length){const w=S.picks[k++];next.push(w);res.push([a,b,w]);}
      else return{done:false,round:r,match:i/2,total:field.length/2,a,b,rounds,count:k};
    }
    rounds.push(res);field=next;r++;
  }
  return{done:true,champ:field[0],rounds,count:k};
}
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip=i=>{const e=ERA[SONGS[i][1]];return`<span class="chip" style="--c:${e[1]}">${e[0]}</span>`};
const col=i=>ERA[SONGS[i][1]][1];
const lines=t=>t.split(" / ").map(x=>`<span>${esc(x)}</span>`).join("");
function hdr(back){return`<div class="top"><div class="brand"><b>|-/</b> &nbsp;bracket</div>${back?`<button class="ghost" id="back" ${S.picks.length||S.lyric!==null?"":"disabled"}>&#8617; Undo</button>`:""}</div><div class="tape"></div>`}
function render(){
  const app=$("#app");
  if(!S.started){
    app.innerHTML=hdr(false)+`<div class="fade">
    <h1>the ultimate<br><span class="y">twenty one</span> <span class="r">pilots</span><br>bracket</h1>
    <p class="lead">32 songs from every era. Head-to-head, one tap at a time, until only one is left standing. Go with your gut.</p>
    <div class="facts"><div class="fact"><b>32</b><span>songs</span></div><div class="fact"><b>5</b><span>rounds</span></div><div class="fact"><b>1</b><span>champion</span></div></div>
    <div class="eras">${Object.values(ERA).map(e=>`<span class="chip" style="--c:${e[1]}">${e[0]}</span>`).join("")}</div>
    <button class="cta" id="go">Start the bracket</button>
    <p class="small">Takes about 3 minutes. You can undo any pick.</p></div>`;
    $("#go").onclick=()=>{S.started=true;save();render()};return;
  }
  const st=state();
  if(!st.done){
    const pct=st.count/32*100;
    app.innerHTML=hdr(true)+`<div class="meta"><span class="round">${ROUNDS[st.round]}</span><small>Match ${st.match+1} of ${st.total}</small></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="match fade">
      ${card(st.a)}<div class="vs">VS</div>${card(st.b)}
    </div><p class="hint">Tap the one you'd keep.</p>`;
    app.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{b.classList.add("win");setTimeout(()=>{S.picks.push(+b.dataset.i);save();render()},170)});
  } else if(S.lyric===null){
    const c=st.champ;
    app.innerHTML=hdr(true)+`<div class="meta"><span class="round">Bonus round</span><small>Last tap</small></div>
    <div class="bar"><i style="width:${31/32*100}%"></i></div>
    <div class="fade"><div class="champ"><div class="crown">&#128081;</div>${chip(c)}<div class="name">${esc(SONGS[c][0])}</div></div>
    <p class="lead" style="text-align:center;margin-top:4px">Your champion! Now pick the line from it that hits hardest.</p>
    <div style="display:flex;flex-direction:column;gap:12px">${SONGS[c][2].map((l,j)=>`<button class="lyric" style="--c:${col(c)}" data-j="${j}">${lines(l)}</button>`).join("")}</div></div>`;
    app.querySelectorAll(".lyric").forEach(b=>b.onclick=()=>{S.lyric=+b.dataset.j;S.sent=false;S.finishedAt=Date.now();save();render();submit();confetti()});
  } else {
    const c=st.champ,R=st.rounds;
    app.innerHTML=hdr(false)+`<div class="fade champ"><div class="round">Your champion</div><div class="crown">&#128081;</div>${chip(c)}<div class="name">${esc(SONGS[c][0])}</div>
    <div class="quote">${lines(SONGS[c][2][S.lyric])}</div></div>
    <div class="path">${R.map((res,r)=>`<details ${r>=3?"open":""}><summary>${ROUNDS[r]}</summary><ol>${res.map(([a,b,w])=>`<li><b>${esc(SONGS[w][0])}</b> over ${esc(SONGS[w===a?b:a][0])}</li>`).join("")}</ol></details>`).join("")}</div>
    <button class="ghost" id="again" style="margin:22px auto 0;display:block">Run it back</button>
    <p class="small">|-/ stay alive</p>`;
    $("#again").onclick=()=>{if(confirm("Start a brand-new bracket?")){S=fresh();S.started=true;save();render()}};
  }
  const bk=$("#back");if(bk)bk.onclick=()=>{if(S.lyric!==null){S.lyric=null}else S.picks.pop();save();render()};
}
function card(i){return`<button class="pick" style="--c:${col(i)}" data-i="${i}"><span class="seed">#${i+1}</span>${chip(i)}<span class="name">${esc(SONGS[i][0])}</span></button>`}
function payload(){
  const st=state(),c=st.champ,R=st.rounds,f=R[4][0];
  const name=i=>SONGS[i][0];
  const p={_subject:(TEST?"[TEST] ":"")+"TOP Bracket results: "+name(c),_template:"box",_captcha:"false"};
  p["01 Champion"]=name(c)+" ("+ERA[SONGS[c][1]][0]+")";
  p["02 Favorite lyric"]=SONGS[c][2][S.lyric].replace(/ \/ /g," / ");
  p["03 Runner-up"]=name(f[2]===f[0]?f[1]:f[0]);
  p["04 Final Four"]=R[3].flatMap(x=>[x[0],x[1]]).map(name).join(", ");
  p["05 Other lyric options"]=SONGS[c][2].filter((_,j)=>j!==S.lyric).join("  |  ");
  R.forEach((res,r)=>{p[String(6+r).padStart(2,"0")+" "+ROUNDS[r]]=res.map(([a,b,w])=>`${name(w)} over ${name(w===a?b:a)}`).join("\n")});
  p["11 Finished"]=new Date(S.finishedAt||Date.now()).toLocaleString("en-US",{timeZone:"America/Chicago"})+" CT";
  p["12 Device"]=navigator.userAgent.slice(0,160);
  if(TEST)p["00 NOTE"]="TEST SUBMISSION - ignore";
  return p;
}
async function submit(tries=0){
  if(S.sent||S.lyric===null)return;
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},referrer:location.origin+location.pathname,referrerPolicy:"unsafe-url",body:JSON.stringify(payload())});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&String(j.success)!=="false"){S.sent=true;save();document.body.dataset.sent="1";return}
    throw new Error(j.message||r.status);
  }catch(e){document.body.dataset.err=String(e);if(tries<4)setTimeout(()=>submit(tries+1),3000*(tries+1));}
}
function confetti(){const d=document.createElement("div");d.className="confetti";const cs=["#fce300","#e4322b","#f3f1ea"];
  for(let i=0;i<60;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"vw";e.style.background=cs[i%3];e.style.animationDuration=(1.6+Math.random()*1.8)+"s";e.style.animationDelay=Math.random()*.5+"s";d.appendChild(e)}
  document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}
render();
if(S.lyric!==null&&!S.sent)submit(); // retry a pending send on reload
if(TEST&&params.get("auto")==="1"&&S.lyric===null){ // automated test run
  S.started=true;while(!state().done)S.picks.push(Math.random()<.5?state().a:state().b);
  S.lyric=Math.floor(Math.random()*3);S.finishedAt=Date.now();save();render();submit();
}
</script>
</body>
</html>
